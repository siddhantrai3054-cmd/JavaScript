
<!DOCTYPE html>
<html>
<body>

    <h1 id="heading">Hello Siddhant</h1>

    <p class="para">Hello JavaScript</p>

    <p class="para">Learn DOM</p>

    <script>
        // 1. getElementById()
        let a = document.getElementById("heading");
        console.log(a);

        // 2. getElementsByClassName()
        let b = document.getElementsByClassName("para");
        console.log(b);

        // 3. getElementsByTagName()
        let c = document.getElementsByTagName("p");
        console.log(c);

        // 4. querySelector()
        let d = document.querySelector(".para");
        console.log(d);

        // 5. querySelectorAll()
        let e = document.querySelectorAll(".para");
        console.log(e);
    </script>

</body>
</html>
